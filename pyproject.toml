[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "steady-py"
version = "0.0.45"
description = "Analyzes Jupyter notebooks and generates reproducible environment setup cells for Kaggle, Colab, and local Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
steady-py = "steady_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
